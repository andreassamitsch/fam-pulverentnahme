name: Build

on:
  push:
    branches:
      - main
      - feature/staging-real-mix-prototype
      - pr8-pwa-test
      - feature/nfc-personnel
      - feature/worker-guided-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app
        run: dotnet restore .\src\Fam.Pulverentnahme.Web\Fam.Pulverentnahme.Web.csproj

      - name: Restore tests
        run: dotnet restore .\tests\Fam.Pulverentnahme.Web.Tests\Fam.Pulverentnahme.Web.Tests.csproj

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          $files = @(
            '.\src\Fam.Pulverentnahme.Web\wwwroot\app.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\article-colors.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\personnel-auth.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\nfc.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\qr-scanner.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\submit.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\worker-ui.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\worker-enhancements.js',
            '.\src\Fam.Pulverentnahme.Web\wwwroot\sw.js'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        run: dotnet build .\src\Fam.Pulverentnahme.Web\Fam.Pulverentnahme.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test .\tests\Fam.Pulverentnahme.Web.Tests\Fam.Pulverentnahme.Web.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows STAGING package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pr8-pwa-test' || github.ref == 'refs/heads/feature/nfc-personnel' || github.ref == 'refs/heads/feature/worker-guided-ui'
        shell: pwsh
        run: |
          $out = '.\artifacts\FAM-Pulverentnahme-STAGING-win-x64'
          dotnet publish .\src\Fam.Pulverentnahme.Web\Fam.Pulverentnahme.Web.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $out

          Copy-Item .\scripts\start-staging-published.ps1 (Join-Path $out 'start-staging-published.ps1')
          Copy-Item .\scripts\START_STAGING.bat (Join-Path $out 'START_STAGING.bat')

      - name: Upload self-contained Windows STAGING package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pr8-pwa-test' || github.ref == 'refs/heads/feature/nfc-personnel' || github.ref == 'refs/heads/feature/worker-guided-ui'
        uses: actions/upload-artifact@v4
        with:
          name: FAM-Pulverentnahme-STAGING-win-x64
          path: .\artifacts\FAM-Pulverentnahme-STAGING-win-x64\
          if-no-files-found: error
          retention-days: 14
