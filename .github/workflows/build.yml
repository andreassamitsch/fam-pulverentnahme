name: Build

on:
  push:
    branches:
      - main
      - feature/staging-real-mix-prototype
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\src\Fam.Pulverentnahme.Web\Fam.Pulverentnahme.Web.csproj

      - name: Build
        run: dotnet build .\src\Fam.Pulverentnahme.Web\Fam.Pulverentnahme.Web.csproj --configuration Release --no-restore
